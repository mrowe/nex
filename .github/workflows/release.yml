name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build libghostty
        run: |
          cd ghostty
          zig build -Dapp-runtime=none -Doptimize=ReleaseFast -Demit-macos-app=false
          mkdir -p ../lib
          MACOS_LIB=$(find . "$ZIG_LOCAL_CACHE_DIR" -path "*/GhosttyKit.xcframework/macos-*/*.a" -type f 2>/dev/null | head -1)
          if [ -z "$MACOS_LIB" ]; then
            echo "::error::Could not find macOS libghostty.a in xcframework output"
            find . "$ZIG_LOCAL_CACHE_DIR" -name "*ghostty*.a" -type f 2>/dev/null
            exit 1
          fi
          cp "$MACOS_LIB" ../lib/libghostty.a

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Build archive
        run: |
          xcodebuild archive \
            -scheme Nex \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Nex.xcarchive \
            -skipMacroValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.version }} \
            MARKETING_VERSION=${{ steps.version.outputs.version }}

      # Ad-hoc signed, not notarized: no Apple Developer account. Sparkle
      # verifies updates with its own EdDSA key, so auto-update still works;
      # only the first manual install needs the quarantine flag cleared.
      - name: Sign app
        run: |
          APP_PATH="build/Nex.xcarchive/Products/Applications/Nex.app"
          codesign --force --deep --sign - --options runtime \
            --entitlements Nex/Nex.entitlements "$APP_PATH"
          codesign --verify --verbose "$APP_PATH"

      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir -p build/dmg
          cp -R build/Nex.xcarchive/Products/Applications/Nex.app build/dmg/
          create-dmg \
            --volname "Nex" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Nex.app" 150 190 \
            --app-drop-link 450 190 \
            "build/Nex-${{ steps.version.outputs.version }}.dmg" \
            "build/dmg/"

      - name: Sign DMG with Sparkle
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_TAG=$(curl -sI "https://github.com/sparkle-project/Sparkle/releases/latest" | grep -i location | sed 's/.*tag\///' | tr -d '\r')
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TAG}/Sparkle-${SPARKLE_TAG}.tar.xz" -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle
          tar xf /tmp/sparkle.tar.xz -C /tmp/sparkle

          DMG="build/Nex-${{ steps.version.outputs.version }}.dmg"

          OUTPUT=$(/tmp/sparkle/bin/sign_update "$DMG" -f <(printf '%s' "$SPARKLE_PRIVATE_KEY"))

          SIGNATURE=$(echo "$OUTPUT" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(stat -f%z "$DMG")

          echo "signature=${SIGNATURE}" >> "$GITHUB_OUTPUT"
          echo "length=${LENGTH}" >> "$GITHUB_OUTPUT"

      # Installed apps reject any update not signed by the key behind their
      # SUPublicEDKey, so a mismatched secret must fail here, not ship.
      - name: Verify Sparkle signature against SUPublicEDKey
        env:
          DMG: build/Nex-${{ steps.version.outputs.version }}.dmg
          SIGNATURE: ${{ steps.sign.outputs.signature }}
        run: |
          export PUBLIC_KEY=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' \
            build/Nex.xcarchive/Products/Applications/Nex.app/Contents/Info.plist)
          cat > "$RUNNER_TEMP/verify.swift" << 'EOF'
          import CryptoKit
          import Foundation

          let env = ProcessInfo.processInfo.environment
          let key = try Curve25519.Signing.PublicKey(rawRepresentation: Data(base64Encoded: env["PUBLIC_KEY"]!)!)
          let dmg = try Data(contentsOf: URL(fileURLWithPath: env["DMG"]!))
          guard key.isValidSignature(Data(base64Encoded: env["SIGNATURE"]!)!, for: dmg) else {
              print("::error::DMG signature does not match SUPublicEDKey; SPARKLE_PRIVATE_KEY is the wrong key")
              exit(1)
          }
          print("Sparkle signature matches SUPublicEDKey")
          EOF
          swift "$RUNNER_TEMP/verify.swift"

      # The feed ships as a release asset (SUFeedURL = releases/latest/download/
      # appcast.xml) rather than a commit: the main ruleset blocks bot pushes.
      # It only carries the newest version, which is all Sparkle needs.
      - name: Build appcast.xml
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNATURE: ${{ steps.sign.outputs.signature }}
          LENGTH: ${{ steps.sign.outputs.length }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, datetime, email.utils

          version = os.environ["VERSION"]
          signature = os.environ["SIGNATURE"]
          length = os.environ["LENGTH"]
          tag = os.environ["TAG_NAME"]
          repo = os.environ["REPO"]
          pub_date = email.utils.formatdate(localtime=True)
          dmg_url = f"https://github.com/{repo}/releases/download/{tag}/Nex-{version}.dmg"

          item = f"""    <item>
              <title>Version {version}</title>
              <pubDate>{pub_date}</pubDate>
              <sparkle:version>{version}</sparkle:version>
              <sparkle:shortVersionString>{version}</sparkle:shortVersionString>
              <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
              <enclosure
                url="{dmg_url}"
                sparkle:edSignature="{signature}"
                length="{length}"
                type="application/octet-stream" />
            </item>"""

          with open("appcast.xml") as f:
              content = f.read()

          content = content.replace("  </channel>", item + "\n  </channel>", 1)

          with open("build/appcast.xml", "w") as f:
              f.write(content)
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Nex-${{ steps.version.outputs.version }}.dmg
            build/appcast.xml
          generate_release_notes: true
          draft: false
